name: Nocturne CLI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: nocturne-cli-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/tests.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Release build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --locked --release --bin nocturne
      - name: Release build (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --bin nocturne
      - name: Portable smoke test
        run: cargo run --locked -p xtask -- portable-smoke
      - name: Package binary and license
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE dist/LICENSE
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/nocturne.exe dist/
          else
            cp target/release/nocturne dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nocturne") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo version v$version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: nocturne-*
          path: artifacts
      - name: Package release assets
        shell: bash
        run: |
          directories=(artifacts/nocturne-*)
          if [[ ${#directories[@]} -ne 3 || ! -d "${directories[0]}" ]]; then
            echo "::error::Expected artifacts from all three build platforms"
            exit 1
          fi
          mkdir dist
          for directory in "${directories[@]}"; do
            platform=$(basename "$directory")
            name="nocturne-$RELEASE_TAG-${platform#nocturne-}"
            if [[ -f "$directory/nocturne.exe" ]]; then
              (cd "$directory" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" nocturne.exe LICENSE)
            else
              chmod +x "$directory/nocturne"
              tar -czf "dist/$name.tar.gz" -C "$directory" nocturne LICENSE
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Nocturne $RELEASE_TAG" --generate-notes
