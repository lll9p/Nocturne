name: Nocturne CLI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Release build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --locked --release --bin nocturne
      - name: Release build (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --bin nocturne
      - name: Portable smoke test
        run: cargo run --locked -p xtask -- portable-smoke
      - name: Package binary and license
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE dist/LICENSE
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/nocturne.exe dist/
          else
            cp target/release/nocturne dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
